global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'eopiez'
    environment: 'development'

scrape_configs:
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:8000']
    metrics_path: '/metrics'

  - job_name: 'julia-backend'
    static_configs:
      - targets: ['julia-backend:8080']
    metrics_path: '/metrics'

  - job_name: 'al-uls-service'
    static_configs:
      - targets: ['al-uls-service:8001']
    metrics_path: '/metrics'

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
